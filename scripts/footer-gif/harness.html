<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#101d17}#scene{position:relative;width:888px;height:168px;background:#101d17;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style>
<div id="scene"><canvas class="runner"></canvas></div>
<script type="module">
  // Deterministic clock and randomness: the same GIF comes out of every build.
  let seed = Number(new URLSearchParams(location.search).get("seed") || 7);
  Math.random = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  window.__time = 0;
  performance.now = () => window.__time;
  window.__callback = null;
  window.requestAnimationFrame = (callback) => { window.__callback = callback; return 1; };
  window.cancelAnimationFrame = () => { window.__callback = null; };
  const { createRunner } = await import("./runner.js");
  const scene = document.getElementById("scene");
  window.__runner = createRunner(scene.querySelector("canvas"), scene, { pixel: 3 });
  window.__ready = true;
</script>
