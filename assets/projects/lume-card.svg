<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">Lume — a quiet command center for your AI agents</title>
  <desc id="d">The Lume project card: the pixel dinosaur mascot, the product line and a panel with three agent sessions, on Lume's night-green identity.</desc>
  <defs>
    <radialGradient id="glow" cx="76%" cy="48%" r="60%"><stop offset="0" stop-color="#aec695" stop-opacity=".20"/><stop offset=".55" stop-color="#aec695" stop-opacity=".05"/><stop offset="1" stop-color="#aec695" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a5646"/><stop offset=".5" stop-color="#22362c"/><stop offset="1" stop-color="#34503f"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="958" height="338" rx="26"/></clipPath>
    <style>
      .ring { transform-box: view-box; animation: turn 90s linear infinite; transform-origin: 756px 176px; }
      @keyframes turn { to { transform: rotate(360deg); } }
      .float { animation: bob 6s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { .ring, .float { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="338" rx="26" fill="#101d17"/>
  <g clip-path="url(#card)">
    <rect width="960" height="340" fill="url(#glow)"/>
    <g class="ring"><g transform="translate(756 176) rotate(-13)">
      <ellipse cx="0" cy="0" rx="300.0" ry="128.0" transform="rotate(0.0)" fill="none" stroke="#8aa174" stroke-opacity="0.42" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="283.5" ry="121.0" transform="rotate(2.2)" fill="none" stroke="#8aa174" stroke-opacity="0.38" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="267.0" ry="113.9" transform="rotate(4.4)" fill="none" stroke="#8aa174" stroke-opacity="0.33" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="250.5" ry="106.9" transform="rotate(6.6)" fill="none" stroke="#8aa174" stroke-opacity="0.28" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="234.0" ry="99.8" transform="rotate(8.8)" fill="none" stroke="#8aa174" stroke-opacity="0.24" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="217.5" ry="92.8" transform="rotate(11.0)" fill="none" stroke="#8aa174" stroke-opacity="0.20" stroke-width="1.2"/>
      <ellipse cx="0" cy="0" rx="201.0" ry="85.8" transform="rotate(13.2)" fill="none" stroke="#8aa174" stroke-opacity="0.15" stroke-width="1.2"/>
      </g></g>
    <path d="M0 339H960" stroke="#aec695" stroke-opacity=".0"/>
  </g>
  <rect x="1" y="1" width="958" height="338" rx="26" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- mascot on the orb -->
  <g transform="translate(48 44)">
    <circle cx="26" cy="26" r="26" fill="#172720" stroke="#2b4a3d" stroke-width="1.5"/>
    <g transform="translate(9 8) scale(1.2)" shape-rendering="crispEdges">
      <path d="M4 16h3v-2h3V9h3V6h11v2h3v8h-9v2h4v4h-5v4h-4v-5h-3v5H7v-5H5v-2H3v-4h1z" fill="#63a57d"/><path d="M10 15h3v2h5v3h-8z" fill="#b9dcc4"/>
      <rect x="21" y="9" width="3" height="3" fill="#f4f5ee"/><rect x="23" y="9" width="1" height="2" fill="#101d17"/>
      <rect x="7" y="25" width="5" height="2" fill="#63a57d"/><rect x="13" y="25" width="5" height="2" fill="#63a57d"/>
    </g>
  </g>
  <text x="116" y="66" fill="#aec695" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.4">LOCAL-FIRST  ·  OPEN SOURCE</text>
  <text x="116" y="86" fill="#7f9387" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" letter-spacing=".2">Windows  ·  Linux  ·  macOS</text>

  <text x="46" y="170" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="500" letter-spacing="-3.2">Lume</text>
  <text x="48" y="206" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="-.6">A quiet command center for your AI agents.</text>
  <text x="48" y="234" fill="#97a99e" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="-.1">Codex, Claude Code, Gemini and more in one floating orb: follow every</text>
  <text x="48" y="254" fill="#97a99e" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="-.1">session, approve what they ask and keep your history on your machine.</text>

  <g transform="translate(48 280)">
    <rect width="190" height="38" rx="19" fill="#aec695"/>
    <text x="24" y="24.5" fill="#101d17" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700">lumeagents.dev</text>
    <path d="M158 19h14m-5-5 5 5-5 5" stroke="#101d17" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="24.5" fill="#6f8a79" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RUST  ·  TAURI  ·  SVELTE</text>
  </g>

  <!-- the panel -->
  <g class="float">
    <rect x="596" y="46" width="308" height="248" rx="22" fill="#14231c" stroke="#2f4d3f" stroke-width="1.5"/>
    <rect x="596" y="46" width="308" height="52" rx="22" fill="#172b22"/>
    <rect x="596" y="76" width="308" height="22" fill="#172b22"/>
    <path d="M596 98.5h308" stroke="#2b4a3d" stroke-opacity=".8"/>
    <g transform="translate(612 52) scale(1.0)" shape-rendering="crispEdges">
      <path d="M4 16h3v-2h3V9h3V6h11v2h3v8h-9v2h4v4h-5v4h-4v-5h-3v5H7v-5H5v-2H3v-4h1z" fill="#63a57d"/><path d="M10 15h3v2h5v3h-8z" fill="#b9dcc4"/>
      <rect x="21" y="9" width="3" height="3" fill="#f4f5ee"/><rect x="23" y="9" width="1" height="2" fill="#101d17"/>
      <rect x="7" y="25" width="5" height="2" fill="#63a57d"/><rect x="13" y="25" width="5" height="2" fill="#63a57d"/>
    </g>
    <text x="652" y="77" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="-.3">Lume</text>
    <text x="882" y="76" fill="#8fa397" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="end">3 sessions</text>
    
    <rect x="612" y="110" width="276" height="48" rx="12" fill="#1b2f26" stroke="#2b4a3d" stroke-opacity=".7"/>
    <circle cx="636" cy="131" r="9" fill="#63a57d" fill-opacity=".18"><animate attributeName="r" values="6;12;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values=".3;0;.3" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="636" cy="131" r="4.5" fill="#63a57d"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="654" y="128" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="-.2">Codex</text>
    <text x="654" y="146" fill="#8fa397" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Lume · refactor auth</text>
    <text x="872" y="137" fill="#63a57d" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">Working</text>
    <rect x="612" y="168" width="276" height="48" rx="12" fill="#1b2f26" stroke="#2b4a3d" stroke-opacity=".7"/>
    <circle cx="636" cy="189" r="4.5" fill="#d3a24b"></circle>
    <text x="654" y="186" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="-.2">Claude Code</text>
    <text x="654" y="204" fill="#8fa397" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">api · migrations</text>
    <text x="872" y="195" fill="#d3a24b" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">Needs permission</text>
    <rect x="612" y="226" width="276" height="48" rx="12" fill="#1b2f26" stroke="#2b4a3d" stroke-opacity=".7"/>
    <circle cx="636" cy="247" r="4.5" fill="#7b8a80"></circle>
    <text x="654" y="244" fill="#e4eadf" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="-.2">Gemini</text>
    <text x="654" y="262" fill="#8fa397" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">docs · landing</text>
    <text x="872" y="253" fill="#7b8a80" font-family="Manrope, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="end">Finished</text>
  </g>
</svg>
