name: Refresh profile tiles

# Rebuilds the images of the README. The "Now" tile reads the latest Lume release and the commit
# count of the last 30 days, so it is refreshed once a day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/orb.png", "assets/fonts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the refreshed tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tiles
          git diff --cached --quiet || git commit -m "chore: refresh profile tiles"
          git push
